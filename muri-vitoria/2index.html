```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fashion Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    overflow:hidden;
}
 


.hero{
    width:100%;
    height:100vh;
    background:
        linear-gradient(rgba(98,0,138,.55), rgba(255,105,180,.45)),
        url("https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
}

.overlay{
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(8px);
    padding:50px;
    border-radius:20px;
    text-align:center;
    max-width:650px;
    color:#fff;
    border:2px solid rgba(255,255,255,.3);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.overlay h1{
    font-size:3.5rem;
    color:#ffffff;
    margin-bottom:20px;
}

.overlay p{
    font-size:1.3rem;
    line-height:1.6;
    margin-bottom:35px;
}

strong{
    color:#ffd6f4;
}

button{
    background:linear-gradient(45deg,#ff4fa3,#8a2be2);
    color:#fff;
    border:none;
    padding:16px 40px;
    font-size:18px;
    border-radius:50px;
    cursor:pointer;
    transition:.3s;
    font-weight:bold;
}

button:hover{
    transform:scale(1.08);
    box-shadow:0 0 20px #ff6fcf;
}

footer{
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
    color:white;
    font-size:14px;
    text-shadow:1px 1px 5px black;
}
</style>

</head>
<body>

<div class="hero">

    <div class="overlay">
        <h1>✨ Nova Coleção 2026 ✨</h1>

        <p>
            Descubra roupas modernas, elegantes e confortáveis.
            Aproveite ofertas exclusivas com até
            <strong>50% OFF</strong> em peças selecionadas.
        </p>

        <button>🛍 Comprar Agora</button>
    </div>

</div>

<footer>
    © 2026 Fashion Store • Tendências em Moda
</footer>

</body>
</html>
```
